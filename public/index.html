<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>彩票开奖统计</title>
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family:"Microsoft YaHei",sans-serif; background:#f5f6fa; color:#333; }
  header { background:#2c3e50; color:#fff; padding:14px 20px; display:flex; gap:12px; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  .fb-btn {
    margin-left:14px; padding:6px 16px; border-radius:6px; cursor:pointer;
    background:#e74c3c; color:#fff; border:none; font-size:14px;
  }
  .fb-btn:hover { background:#c0392b; }
  /* 顶部「意见」按钮：低调描边样式，不抢眼 */
  #openFb {
    background:transparent;
    border:1px solid rgba(255,255,255,.35);
    color:#cdd6e0;
    font-size:13px; padding:5px 14px;
  }
  #openFb:hover { background:rgba(255,255,255,.1); color:#fff; }
  .tabs { display:flex; gap:10px; margin-left:auto; }
  .tab { padding:8px 18px; border-radius:6px; cursor:pointer; background:#34495e; color:#fff; border:none; font-size:14px; }
  .tab.active { background:#e74c3c; }
  .panel { display:none; padding:20px; }
  .panel.active { display:block; }
  .section-title { font-weight:bold; margin:18px 0 10px; font-size:15px; color:#2c3e50; }
  .balls { display:flex; flex-wrap:wrap; gap:10px; }
  .ball-wrap {
    display:flex; flex-direction:column; align-items:center;
    width:52px; gap:5px;
  }
  .ball {
    width:46px; height:46px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-weight:bold; font-size:16px; color:#fff; margin:0 auto;
    box-shadow:0 2px 4px rgba(0,0,0,.2);
  }
  .ball.red  { background:radial-gradient(circle at 30% 30%, #ff6b6b, #c0392b); }
  .ball.blue { background:radial-gradient(circle at 30% 30%, #5dade2, #2471a3); }
  /* 出现次数：移到球上方，醒目徽标样式（背景色由 JS 按热度着色） */
  .count {
    width:100%; min-height:18px; padding:2px 0;
    font-size:13px; font-weight:bold; line-height:1; color:#fff;
    text-align:center; border-radius:9px;
    background:#e74c3c; box-shadow:0 1px 3px rgba(0,0,0,.25);
  }
  /* 时间范围选择条 */
  .range-bar {
    display:flex; align-items:center; flex-wrap:wrap; gap:8px;
    padding:10px 20px; background:#fff; border-bottom:1px solid #eee;
  }
  .range-bar .rb-label { font-size:13px; color:#666; margin-right:2px; }
  .range-btn {
    padding:6px 14px; border:1px solid #d0d7de; background:#fff;
    border-radius:16px; cursor:pointer; font-size:13px; color:#333;
    transition:all .15s;
  }
  .range-btn:hover { border-color:#e74c3c; color:#e74c3c; }
  .range-btn.active { background:#e74c3c; color:#fff; border-color:#e74c3c; font-weight:bold; }
  table { width:100%; border-collapse:collapse; margin-top:14px; background:#fff; border-radius:8px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  th,td { padding:9px 12px; text-align:center; border-bottom:1px solid #eee; font-size:13px; }
  th { background:#ecf0f1; color:#2c3e50; }
  .red-num { color:#c0392b; font-weight:bold; }
  .blue-num { color:#2471a3; font-weight:bold; }
  .loading { color:#888; padding:30px; text-align:center; }
  /* 意见抽屉：默认隐藏，点击按钮从右侧滑出 */
  .drawer-mask {
    position:fixed; inset:0; background:rgba(0,0,0,.35); display:none; z-index:900;
  }
  .drawer-mask.show { display:block; }
  .feedback-area {
    position:fixed; top:0; right:0; height:100vh; width:340px; max-width:90vw;
    background:#fff; box-shadow:-4px 0 16px rgba(0,0,0,.2); z-index:901;
    display:flex; flex-direction:column; padding:14px; transform:translateX(100%);
    transition:transform .25s ease;
  }
  .feedback-area.show { transform:translateX(0); }
  .feedback-head { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .feedback-head h2 { font-size:15px; margin:0; color:#2c3e50; }
  .fb-close {
    background:none; border:none; font-size:20px; color:#999; cursor:pointer; line-height:1;
  }
  .fb-close:hover { color:#333; }
  .fb-list { overflow-y:auto; flex:1 1 auto; }
  .fb-item { border-bottom:1px solid #f0f0f0; padding:8px 2px; }
  .fb-item .fb-meta { font-size:12px; color:#999; margin-bottom:3px; display:flex; justify-content:space-between; }
  .fb-item .fb-content { font-size:13px; color:#333; word-break:break-word; white-space:pre-wrap; }
  .fb-empty { color:#aaa; text-align:center; padding:24px 0; font-size:13px; }
  .fb-add { margin-top:10px; width:100%; padding:10px; border:none; border-radius:6px; background:#e74c3c; color:#fff; font-size:14px; cursor:pointer; }
  .fb-add:hover { background:#c0392b; }
  /* 弹窗 */
  .modal-mask {
    position:fixed; inset:0; background:rgba(0,0,0,.45); display:none;
    align-items:center; justify-content:center; z-index:999;
  }
  .modal-mask.show { display:flex; }
  .modal {
    background:#fff; border-radius:10px; width:380px; max-width:92vw; padding:18px;
    box-shadow:0 8px 24px rgba(0,0,0,.25);
  }
  .modal h3 { margin:0 0 12px; font-size:16px; color:#2c3e50; }
  .modal label { display:block; font-size:13px; color:#555; margin:8px 0 4px; }
  .modal input, .modal textarea {
    width:100%; border:1px solid #ddd; border-radius:6px; padding:8px;
    font-size:13px; font-family:inherit; box-sizing:border-box;
  }
  .modal textarea { resize:vertical; min-height:90px; }
  .modal .err { color:#e74c3c; font-size:12px; min-height:16px; margin-top:4px; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:14px; }
  .modal-actions button {
    padding:7px 16px; border-radius:6px; border:none; cursor:pointer; font-size:13px;
  }
  .btn-cancel { background:#ecf0f1; color:#333; }
  .btn-submit { background:#e74c3c; color:#fff; }
  .btn-submit:hover { background:#c0392b; }
</style>
</head>
<body>
<header>
  <h1>彩票开奖统计</h1>
  <button class="fb-btn" id="openFb">意见</button>
  <div class="tabs">
    <button class="tab active" data-type="ssq">福利双色球</button>
    <button class="tab" data-type="dlt">体彩大乐透</button>
  </div>
</header>

<div class="range-bar">
  <span class="rb-label">时间范围：</span>
  <button class="range-btn" data-range="month">本月</button>
  <button class="range-btn active" data-range="year">本年</button>
  <button class="range-btn" data-range="lastyear">去年</button>
  <button class="range-btn" data-range="3y">三年内</button>
  <button class="range-btn" data-range="5y">五年内</button>
  <button class="range-btn" data-range="10y">十年内</button>
</div>

<div class="main">
  <div class="lottery-area">
    <section class="panel active" id="panel-ssq">
      <div class="section-title">红球出现次数（1-33）</div>
      <div class="balls" id="ssq-red"></div>
      <div class="section-title">蓝球出现次数（1-16）</div>
      <div class="balls" id="ssq-blue"></div>
      <div class="section-title">开奖列表</div>
      <table><thead><tr><th>期号</th><th>红球</th><th>蓝球</th><th>开奖时间</th></tr></thead>
        <tbody id="ssq-list"><tr><td colspan="4" class="loading">加载中...</td></tr></tbody></table>
    </section>

    <section class="panel" id="panel-dlt">
      <div class="section-title">红球出现次数（1-35）</div>
      <div class="balls" id="dlt-red"></div>
      <div class="section-title">蓝球出现次数（1-12）</div>
      <div class="balls" id="dlt-blue"></div>
      <div class="section-title">开奖列表</div>
      <table><thead><tr><th>期号</th><th>红球</th><th>蓝球</th><th>开奖时间</th></tr></thead>
        <tbody id="dlt-list"><tr><td colspan="4" class="loading">加载中...</td></tr></tbody></table>
    </section>
  </div>
</div>

<!-- 遮罩 + 意见抽屉（默认隐藏，点击「意见」按钮滑出） -->
<div class="drawer-mask" id="fbMask"></div>
<aside class="feedback-area" id="fbDrawer">
  <div class="feedback-head">
    <h2>意见反馈</h2>
    <button class="fb-close" id="fbClose">&times;</button>
  </div>
  <div class="fb-list" id="fbList"><div class="fb-empty">加载中...</div></div>
  <button class="fb-btn fb-add" id="openFbModal">我要反馈</button>
</aside>

<!-- 反馈弹窗 -->
<div class="modal-mask" id="fbModal">
  <div class="modal">
    <h3>提交意见</h3>
    <label>昵称（选填，最多 30 字）</label>
    <input type="text" id="fbNick" maxlength="30" placeholder="匿名">
    <label>内容（必填，最多 500 字）</label>
    <textarea id="fbContent" maxlength="500" placeholder="请输入您的意见或建议..."></textarea>
    <div class="err" id="fbErr"></div>
    <div class="modal-actions">
      <button class="btn-cancel" id="fbCancel">取消</button>
      <button class="btn-submit" id="fbSubmit">提交</button>
    </div>
  </div>
</div>

<script>
const apiBase = '/api/index.php';

// 当前选中的彩种与时间范围
let currentType  = 'ssq';
let currentRange = 'year';
const loadedKeys = new Set();   // 已加载过的 (type:range) 组合，避免重复请求

function renderBalls(containerId, counts, cls) {
  const el = document.getElementById(containerId);
  el.innerHTML = '';
  // 后端 redCount/blueCount 可能是对象 {"1":次数,...} 或数组 [次数,...]，两种都兼容
  let entries;
  if (counts && typeof counts === 'object' && !Array.isArray(counts)) {
    entries = Object.entries(counts).sort((a, b) => Number(a[0]) - Number(b[0]));
  } else if (Array.isArray(counts)) {
    entries = counts.map((c, i) => [String(i + 1), c]);
  } else {
    entries = [];
  }
  // 计算最大次数，用于热度着色（次数越高颜色越偏红，更醒目）
  let maxC = 0;
  entries.forEach(([, c]) => { const n = Number(c); if (n > maxC) maxC = n; });
  entries.forEach(([num, c]) => {
    const n = Number(c);
    const heat = maxC > 0 ? n / maxC : 0;          // 0~1
    const hue  = Math.round(120 - heat * 120);     // 绿(120) -> 红(0)
    const wrap = document.createElement('div');
    wrap.className = 'ball-wrap';
    // 次数显示在球「上方」，背景按热度着色
    wrap.innerHTML =
      `<div class="count" style="background:hsl(${hue},75%,48%)">${n}</div>` +
      `<div class="ball ${cls}">${num}</div>`;
    el.appendChild(wrap);
  });
}

async function loadModule(type, range) {
  // 统计（按时间范围过滤）
  const stats = await fetch(`${apiBase}?action=stats&type=${type}&range=${range}`).then(r => r.json());
  if (stats.code === 1) {
    renderBalls(`${type}-red`, stats.redCount, 'red');
    renderBalls(`${type}-blue`, stats.blueCount, 'blue');
  }
  // 列表（同范围过滤）
  const list = await fetch(`${apiBase}?action=list&type=${type}&range=${range}`).then(r => r.json());
  const tbody = document.getElementById(`${type}-list`);
  if (list.code === 1 && list.data.length) {
    tbody.innerHTML = list.data.map(r => {
      const reds  = r.red.split(',').map(n => `<span class="red-num">${n}</span>`).join(' ');
      const blues = r.blue.split(',').map(n => `<span class="blue-num">${n}</span>`).join(' ');
      return `<tr><td>${r.issue}</td><td>${reds}</td><td>${blues}</td><td>${r.open_time || '-'}</td></tr>`;
    }).join('');
  } else {
    tbody.innerHTML = '<tr><td colspan="4" class="loading">该时间范围内暂无数据</td></tr>';
  }
}

// 激活某个 (彩种 + 范围) 组合：切换高亮 + 加载数据
function activate(type, range) {
  currentType = type;
  currentRange = range;
  // 高亮 tab
  document.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.type === type));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + type));
  // 高亮范围按钮
  document.querySelectorAll('.range-btn').forEach(b => b.classList.toggle('active', b.dataset.range === range));
  // 仅在未加载过时请求
  const key = type + ':' + range;
  if (!loadedKeys.has(key)) {
    loadModule(type, range);
    loadedKeys.add(key);
  }
}

// Tab 切换
document.querySelectorAll('.tab').forEach(btn => {
  btn.addEventListener('click', () => activate(btn.dataset.type, currentRange));
});
// 时间范围切换
document.querySelectorAll('.range-btn').forEach(btn => {
  btn.addEventListener('click', () => activate(currentType, btn.dataset.range));
});

// 默认：双色球 + 本年
activate('ssq', 'year');

// ---------- 意见反馈 ----------
const fbModal   = document.getElementById('fbModal');
const fbList    = document.getElementById('fbList');
const fbNick    = document.getElementById('fbNick');
const fbContent = document.getElementById('fbContent');
const fbErr     = document.getElementById('fbErr');

// HTML 转义，防止 XSS
function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function loadFeedback() {
  try {
    const res  = await fetch(`${apiBase}?action=feedback_list`);
    const data = await res.json();
    if (data.code === 1 && data.data.length) {
      fbList.innerHTML = data.data.map(f => `
        <div class="fb-item">
          <div class="fb-meta"><span>${esc(f.nickname || '匿名')}</span><span>${esc(f.created_at || '')}</span></div>
          <div class="fb-content">${esc(f.content)}</div>
        </div>`).join('');
    } else {
      fbList.innerHTML = '<div class="fb-empty">暂无意见，快来抢沙发～</div>';
    }
  } catch (e) {
    fbList.innerHTML = '<div class="fb-empty">加载失败</div>';
  }
}

function openModal() { fbErr.textContent = ''; fbModal.classList.add('show'); fbContent.focus(); }
function closeModal() { fbModal.classList.remove('show'); fbNick.value=''; fbContent.value=''; fbErr.textContent=''; }

const fbDrawer = document.getElementById('fbDrawer');
const fbMask   = document.getElementById('fbMask');
let fbLoaded = false;

function openDrawer() {
  fbDrawer.classList.add('show');
  fbMask.classList.add('show');
  if (!fbLoaded) { loadFeedback(); fbLoaded = true; }  // 首次打开才加载列表
}
function closeDrawer() {
  fbDrawer.classList.remove('show');
  fbMask.classList.remove('show');
}

document.getElementById('openFb').addEventListener('click', openDrawer);
document.getElementById('fbClose').addEventListener('click', closeDrawer);
fbMask.addEventListener('click', closeDrawer);
// 抽屉内的「我要反馈」按钮 → 打开提交弹窗
document.getElementById('openFbModal').addEventListener('click', openModal);

document.getElementById('fbCancel').addEventListener('click', closeModal);
fbModal.addEventListener('click', e => { if (e.target === fbModal) closeModal(); });

document.getElementById('fbSubmit').addEventListener('click', async () => {
  const content = fbContent.value.trim();
  if (!content) { fbErr.textContent = '内容不能为空'; return; }
  const btn = document.getElementById('fbSubmit');
  btn.disabled = true; btn.textContent = '提交中...';
  try {
    const fd = new FormData();
    fd.append('nickname', fbNick.value.trim());
    fd.append('content', content);
    const res  = await fetch(`${apiBase}?action=feedback_add`, { method: 'POST', body: fd });
    const data = await res.json();
    if (data.code === 1) {
      closeModal();
      await loadFeedback();
    } else {
      fbErr.textContent = data.msg || '提交失败';
    }
  } catch (e) {
    fbErr.textContent = '提交失败：无法连接服务器，请确认后端接口 /api/index.php 已部署可访问';
  } finally {
    btn.disabled = false; btn.textContent = '提交';
  }
});
</script>
</body>
</html>
