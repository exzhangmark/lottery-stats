server {
    listen 80;
    # 用 _ 作为通配 server_name，绑定到任意主机名（含直接 IP 访问）
    server_name _;

    # 项目根目录（api/ 与 public/ 都在其下）
    root /www/lottery;
    index index.html;

    # 前端静态页：根路径回退到 public/index.html
    # 注意：不要用 $uri/，否则请求 / 时会因目录回退而 403
    location / {
        try_files $uri /public/index.html;
    }

    # 数据接口：/api/index.php 映射到项目根下的 api/ 目录
    location /api/ {
        try_files $uri $uri/ /api/index.php?$query_string;
    }

    # PHP 交由 PHP-FPM（监听 127.0.0.1:9000，部署脚本会一并配置）
    location ~ \.php$ {
        fastcgi_pass   127.0.0.1:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }
}
